name: Build BasicLinux ISO

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            libncurses-dev cpio xz-utils \
            grub-pc-bin grub-common xorriso mtools

      - name: Cache downloaded sources
        uses: actions/cache@v4
        with:
          path: src/*.tar.*
          key: sources-${{ hashFiles('build.sh') }}

      - name: Build
        run: bash build.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: BasicLinux-iso
          path: out/BasicLinux.iso
          if-no-files-found: error
